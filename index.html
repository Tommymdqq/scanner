<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escáner de Fundas & Productos</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(23, 32, 51, 0.7);
      --bg-glass: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* Modos de Vista */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view-container {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
    }

    .view-container.active {
      display: flex;
    }

    /* Escáner / Cámara */
    .camera-wrapper {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas.overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Indicator de color activo */
    .live-color-badge {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 5;
    }

    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
    }

    /* Toast */
    .scan-toast {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      z-index: 10;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    /* Botones de Cámara */
    .scanner-controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 24px;
      z-index: 5;
    }

    .btn-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s;
    }

    .btn-circle:active {
      transform: scale(0.92);
    }

    .toggle-auto {
      background: var(--bg-glass);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .toggle-auto.active {
      background: var(--accent-hover);
      color: #fff;
      border-color: var(--accent);
    }

    /* Biblioteca */
    .library-header {
      padding: 14px 16px;
      background: var(--bg-glass);
      display: flex;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-export {
      padding: 10px 14px;
      background: var(--accent-hover);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .grid-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      background: #000;
    }

    .card-content {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Navegación Flotante */
    nav {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      display: flex;
      padding: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .nav-btn {
      padding: 10px 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn.active {
      background: var(--accent);
      color: #000;
    }

    /* Modales */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 30;
    }

    .modal-content {
      background: #1e293b;
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-secondary {
      background: #334155;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Detalle de Producto */
    .detail-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 14px;
      background: #000;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.85rem;
    }

    .detail-label {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>Scanner Pro</h1>
    <span class="badge" id="item-count">0 Registrados</span>
  </header>

  <main>
    <!-- Vista Cámara -->
    <section id="view-camera" class="view-container active">
      <div class="camera-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay-canvas" class="overlay"></canvas>
        
        <div class="live-color-badge">
          <div id="live-swatch" class="color-swatch"></div>
          <span id="live-color-name">Detectando...</span>
        </div>

        <div id="scan-toast" class="scan-toast">¡Objeto Guardado!</div>
      </div>
      <div class="scanner-controls">
        <button id="toggle-auto-btn" class="toggle-auto">Auto-Escaneo: OFF</button>
        <button id="capture-btn" class="btn-circle">📷</button>
        <div style="width: 90px;"></div>
      </div>
    </section>

    <!-- Vista Biblioteca -->
    <section id="view-library" class="view-container">
      <div class="library-header">
        <input type="text" id="search-bar" class="search-input" placeholder="Buscar funda o producto...">
        <button id="export-btn" class="btn-export">JSON</button>
      </div>
      <div id="library-grid" class="grid-list"></div>
    </section>
  </main>

  <!-- Navegación Flotante -->
  <nav>
    <button class="nav-btn active" data-view="view-camera">
      <span>📷</span> Escáner
    </button>
    <button class="nav-btn" data-view="view-library">
      <span>📦</span> Biblioteca
    </button>
  </nav>

  <!-- Modal Guardar -->
  <div id="save-modal" class="modal">
    <div class="modal-content">
      <h3>Registrar Objeto</h3>
      <div class="form-group">
        <label>Nombre o Modelo</label>
        <input type="text" id="modal-title" placeholder="Ej: Funda Silicona iPhone 13">
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="modal-category">
          <option value="Funda Silicona">Funda Silicona</option>
          <option value="Funda Rígida">Funda Rígida</option>
          <option value="Accesorio">Accesorio</option>
          <option value="Cargador">Cargador</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="modal-buttons">
        <button id="btn-cancel-modal" class="btn-secondary">Cancelar</button>
        <button id="btn-save-modal" class="btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Ver Detalle -->
  <div id="detail-modal" class="modal">
    <div class="modal-content">
      <img id="detail-img" class="detail-img" src="" alt="">
      <h3 id="detail-title">Nombre del Producto</h3>
      
      <div class="detail-row">
        <span class="detail-label">Categoría</span>
        <span id="detail-category" style="font-weight: 600;">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Color Detectado</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <div id="detail-swatch" class="color-swatch"></div>
          <span id="detail-color-name" style="font-weight: 600;">-</span>
        </div>
      </div>
      <div class="detail-row">
        <span class="detail-label">Fecha de Registro</span>
        <span id="detail-date" style="color: var(--text-muted);">-</span>
      </div>

      <div class="modal-buttons" style="justify-content: space-between; margin-top: 20px;">
        <button id="btn-delete-detail" class="btn-danger">Eliminar</button>
        <button id="btn-close-detail" class="btn-secondary">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // Variables de Estado
    let autoScan = false;
    let lastScanTime = 0;
    let items = JSON.parse(localStorage.getItem('scanned_items_v2') || '[]');
    let currentTempCapture = null;
    let activeDetailItem = null;
    let currentLiveColor = { hex: '#787878', name: 'Gris' };

    // Elementos DOM
    const video = document.getElementById('webcam');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const ctx = overlayCanvas.getContext('2d');
    const itemCountBadge = document.getElementById('item-count');
    const scanToast = document.getElementById('scan-toast');
    const autoBtn = document.getElementById('toggle-auto-btn');
    const captureBtn = document.getElementById('capture-btn');
    const libraryGrid = document.getElementById('library-grid');
    const searchInput = document.getElementById('search-bar');
    
    const saveModal = document.getElementById('save-modal');
    const detailModal = document.getElementById('detail-modal');

    // Paleta de Colores para Fundas de Silicona
    const SILICONE_PALETTE = [
      { name: 'Negro Matte', hex: '#1e1e1e', h: [0, 360], s: [0, 20], l: [0, 25] },
      { name: 'Blanco / Claro', hex: '#f1f5f9', h: [0, 360], s: [0, 15], l: [80, 100] },
      { name: 'Rojo Silicona', hex: '#ef4444', h: [345, 15], s: [45, 100], l: [30, 70] },
      { name: 'Azul Cobalto', hex: '#2563eb', h: [200, 245], s: [40, 100], l: [25, 65] },
      { name: 'Verde Menta / Olivo', hex: '#10b981', h: [80, 160], s: [25, 100], l: [25, 70] },
      { name: 'Rosa Pastel', hex: '#f472b6', h: [315, 345], s: [30, 100], l: [60, 85] },
      { name: 'Amarillo', hex: '#eab308', h: [45, 75], s: [50, 100], l: [35, 80] },
      { name: 'Púrpura / Violeta', hex: '#a855f7', h: [250, 310], s: [30, 100], l: [30, 70] },
      { name: 'Gris Neutro', hex: '#64748b', h: [0, 360], s: [0, 25], l: [25, 75] }
    ];

    // Inicializar Cámara
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          resizeCanvas();
          requestAnimationFrame(processFrame);
        };
      } catch (err) {
        alert("Permiso de cámara denegado o no disponible.");
      }
    }

    function resizeCanvas() {
      overlayCanvas.width = video.videoWidth || video.clientWidth;
      overlayCanvas.height = video.videoHeight || video.clientHeight;
    }

    window.addEventListener('resize', resizeCanvas);

    // Procesar Fotograma en Tiempo Real
    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        const boxWidth = overlayCanvas.width * 0.55;
        const boxHeight = overlayCanvas.height * 0.45;
        const x = (overlayCanvas.width - boxWidth) / 2;
        const y = (overlayCanvas.height - boxHeight) / 2;

        // Dibujar marco de detección estilo escáner
        ctx.strokeStyle = autoScan ? '#0284c7' : '#38bdf8';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, boxWidth, boxHeight);

        // Muestreo de color central
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 60;
        tempCanvas.height = 60;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(video, x, y, boxWidth, boxHeight, 0, 0, 60, 60);

        const imgData = tempCtx.getImageData(0, 0, 60, 60);
        currentLiveColor = detectSiliconeColor(imgData);

        // Actualizar UI del indicador de color
        document.getElementById('live-swatch').style.backgroundColor = currentLiveColor.hex;
        document.getElementById('live-color-name').textContent = currentLiveColor.name;

        // Auto-captura por movimiento/estabilidad
        const now = Date.now();
        if (autoScan && (now - lastScanTime > 3500)) {
          lastScanTime = now;
          triggerCapture();
        }
      }
      requestAnimationFrame(processFrame);
    }

    // Algoritmo de Detección HSL para Silicona
    function detectSiliconeColor(imageData) {
      const data = imageData.data;
      let totalH = 0, totalS = 0, totalL = 0, count = 0;

      for (let i = 0; i < data.length; i += 16) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const [h, s, l] = rgbToHsl(r, g, b);

        // Filtrar sombras y reflejos blancos deslumbrantes
        if (l > 12 && l < 88) {
          totalH += h; totalS += s; totalL += l;
          count++;
        }
      }

      if (count === 0) return { name: 'Gris Neutro', hex: '#64748b' };

      const avgH = totalH / count;
      const avgS = totalS / count;
      const avgL = totalL / count;

      // Buscar coincidencia en la paleta
      for (let item of SILICONE_PALETTE) {
        const hMatch = item.h[0] > item.h[1] 
          ? (avgH >= item.h[0] || avgH <= item.h[1])
          : (avgH >= item.h[0] && avgH <= item.h[1]);

        if (hMatch && avgS >= item.s[0] && avgS <= item.s[1] && avgL >= item.l[0] && avgL <= item.l[1]) {
          return { name: item.name, hex: item.hex };
        }
      }

      return { name: 'Sólido Detectado', hex: `hsl(${Math.round(avgH)}, ${Math.round(avgS)}%, ${Math.round(avgL)}%)` };
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, l * 100];
    }

    // Captura de Objeto
    function triggerCapture() {
      playBeep();
      if (navigator.vibrate) navigator.vibrate(80);

      scanToast.style.display = 'block';
      setTimeout(() => scanToast.style.display = 'none', 1200);

      const capCanvas = document.createElement('canvas');
      capCanvas.width = 400;
      capCanvas.height = 400;
      const capCtx = capCanvas.getContext('2d');

      const boxWidth = video.videoWidth * 0.55;
      const boxHeight = video.videoHeight * 0.45;
      const x = (video.videoWidth - boxWidth) / 2;
      const y = (video.videoHeight - boxHeight) / 2;

      capCtx.drawImage(video, x, y, boxWidth, boxHeight, 0, 0, 400, 400);

      currentTempCapture = {
        img: capCanvas.toDataURL('image/jpeg', 0.85),
        color: currentLiveColor,
        date: new Date().toLocaleString()
      };

      document.getElementById('modal-title').value = `Funda #${items.length + 1}`;
      saveModal.style.display = 'flex';
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 800;
        gain.gain.value = 0.1;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    // Eventos Modal Guardar
    document.getElementById('btn-save-modal').addEventListener('click', () => {
      const title = document.getElementById('modal-title').value || 'Objeto sin nombre';
      const category = document.getElementById('modal-category').value;

      const newItem = {
        id: Date.now(),
        title,
        category,
        image: currentTempCapture.img,
        colorName: currentTempCapture.color.name,
        colorHex: currentTempCapture.color.hex,
        date: currentTempCapture.date
      };

      items.unshift(newItem);
      localStorage.setItem('scanned_items_v2', JSON.stringify(items));
      updateUI();
      saveModal.style.display = 'none';
    });

    document.getElementById('btn-cancel-modal').addEventListener('click', () => {
      saveModal.style.display = 'none';
    });

    // Abrir Ficha de Detalle al tocar un objeto
    function openDetailModal(item) {
      activeDetailItem = item;
      document.getElementById('detail-img').src = item.image;
      document.getElementById('detail-title').textContent = item.title;
      document.getElementById('detail-category').textContent = item.category;
      document.getElementById('detail-color-name').textContent = item.colorName;
      document.getElementById('detail-swatch').style.backgroundColor = item.colorHex;
      document.getElementById('detail-date').textContent = item.date;

      detailModal.style.display = 'flex';
    }

    document.getElementById('btn-close-detail').addEventListener('click', () => {
      detailModal.style.display = 'none';
    });

    document.getElementById('btn-delete-detail').addEventListener('click', () => {
      if (activeDetailItem) {
        items = items.filter(i => i.id !== activeDetailItem.id);
        localStorage.setItem('scanned_items_v2', JSON.stringify(items));
        updateUI();
        detailModal.style.display = 'none';
      }
    });

    // Renderizar Biblioteca
    function updateUI() {
      itemCountBadge.textContent = `${items.length} Registrados`;
      const filter = searchInput.value.toLowerCase();

      const filtered = items.filter(item => 
        item.title.toLowerCase().includes(filter) || 
        item.category.toLowerCase().includes(filter) ||
        item.colorName.toLowerCase().includes(filter)
      );

      libraryGrid.innerHTML = filtered.map(item => `
        <div class="card" onclick='openDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
          <img src="${item.image}" alt="${item.title}">
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-meta">
              <span class="color-swatch" style="background:${item.colorHex}"></span>
              ${item.colorName}
            </div>
          </div>
        </div>
      `).join('');
    }

    window.openDetail = function(item) {
      openDetailModal(item);
    };

    // Navegación
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(btn.dataset.view).classList.add('active');

        if (btn.dataset.view === 'view-library') {
          updateUI();
        }
      });
    });

    // Controles
    autoBtn.addEventListener('click', () => {
      autoScan = !autoScan;
      autoBtn.classList.toggle('active', autoScan);
      autoBtn.textContent = `Auto-Escaneo: ${autoScan ? 'ON' : 'OFF'}`;
    });

    captureBtn.addEventListener('click', () => triggerCapture());
    searchInput.addEventListener('input', updateUI);

    document.getElementById('export-btn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `inventario_fundas_${Date.now()}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    });

    // Inicializar
    initCamera();
    updateUI();
  </script>
</body>
</html>
