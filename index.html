<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hub Modular de Herramientas</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

    /* Layout Principal */
    .app-container { flex: 1; display: flex; overflow: hidden; position: relative; }

    /* Sidebar / Menú de Herramientas */
    sidebar {
      width: 240px;
      background: rgba(15, 23, 42, 0.6);
      border-right: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-btn {
      padding: 12px 14px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .tool-btn:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .tool-btn.active { background: var(--bg-card); border-color: var(--accent); color: var(--accent); }

    /* Área donde se carga la herramienta activa */
    main { flex: 1; position: relative; overflow-y: auto; }
    .tool-viewport { display: none; width: 100%; height: 100%; }
    .tool-viewport.active { display: block; }

    /* Estilo adaptable para móviles */
    @media (max-width: 768px) {
      .app-container { flex-direction: column-reverse; }
      sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        border-right: none;
        border-top: 1px solid var(--border);
        padding: 8px;
      }
      .tool-btn { padding: 8px 12px; white-space: nowrap; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Toolbox Hub</h1>
    <span id="status-badge" style="font-size: 0.75rem; color: var(--text-muted);">Cargando módulos...</span>
  </header>

  <div class="app-container">
    <sidebar id="tools-sidebar">
      <!-- Los botones de las herramientas se generarán dinámicamente desde config.json -->
    </sidebar>

    <main id="viewports-container">
      <!-- Los contenedores de cada herramienta se cargarán aquí -->
    </main>
  </div>

  <script>
    const loadedTools = {};

    // Sistema de Registro de Módulos Dinámicos
    window.registerTool = function(toolConfig) {
      loadedTools[toolConfig.id] = toolConfig;
      
      const viewport = document.getElementById(`viewport-${toolConfig.id}`);
      if (viewport) {
        toolConfig.render(viewport);
      }
    };

    // Cargador Principal
    async function initHub() {
      const statusBadge = document.getElementById('status-badge');
      const sidebar = document.getElementById('tools-sidebar');
      const container = document.getElementById('viewports-container');

      try {
        // 1. Leer el archivo de configuración dinámico
        const response = await fetch('config.json');
        const toolsList = await response.json();

        sidebar.innerHTML = '';
        container.innerHTML = '';

        // 2. Crear las vistas y botones
        toolsList.forEach((tool, index) => {
          // Botón del Menú
          const btn = document.createElement('button');
          btn.className = `tool-btn ${index === 0 ? 'active' : ''}`;
          btn.dataset.target = tool.id;
          btn.innerHTML = `<span>${tool.icon}</span> <span>${tool.name}</span>`;
          btn.onclick = () => switchTool(tool.id);
          sidebar.appendChild(btn);

          // Contenedor Viewport
          const viewport = document.createElement('div');
          viewport.id = `viewport-${tool.id}`;
          viewport.className = `tool-viewport ${index === 0 ? 'active' : ''}`;
          container.appendChild(viewport);

          // 3. Cargar el script JS de la herramienta dinámicamente
          const script = document.createElement('script');
          script.src = tool.script;
          document.head.appendChild(script);
        });

        statusBadge.textContent = `${toolsList.length} Herramientas Activas`;

      } catch (err) {
        console.error(err);
        statusBadge.textContent = "Error al cargar config.json";
        container.innerHTML = `<div style="padding: 20px; color: #ef4444;">No se pudo cargar el archivo <b>config.json</b>. Asegúrate de que existe en el repositorio de GitHub.</div>`;
      }
    }

    function switchTool(id) {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.target === id));
      document.querySelectorAll('.tool-viewport').forEach(v => v.classList.toggle('active', v.id === `viewport-${id}`));
    }

    initHub();
  </script>
</body>
</html>
